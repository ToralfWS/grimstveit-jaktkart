<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e8"><title>Grimstveit jaktkart</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#d7e1d3}#map{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}.leaflet-interactive:focus,.leaflet-container:focus{outline:none!important}.territory-control{max-width:min(22rem,calc(100vw - 5rem));border:0;border-radius:.85rem;background:rgb(255 255 255 / 96%);box-shadow:0 2px 14px rgb(0 0 0 / 20%);color:#172119;padding:.8rem .9rem;backdrop-filter:blur(6px)}.header{display:flex;align-items:center;justify-content:space-between;gap:.75rem}.title{font-size:1rem;font-weight:760}.sub{font-size:.72rem;color:#647066;margin-top:.08rem}.mode-button{appearance:none;border:1px solid #315f3b;border-radius:.55rem;background:#fff;color:#214b2b;padding:.42rem .62rem;font:700 .76rem/1 inherit;cursor:pointer;white-space:nowrap}.mode-button.active{background:#315f3b;color:#fff}.summary{margin:.7rem 0 .45rem;padding:.58rem .65rem;border-radius:.6rem;background:#eef6ec;border:1px solid #b9d1b3;font-size:.78rem;line-height:1.35}.summary strong{display:block;font-size:.98rem}.legend{display:flex;align-items:center;gap:.42rem;margin-top:.45rem;font-size:.72rem;color:#526055}.legend-swatch{width:1.3rem;height:.65rem;border-radius:.2rem;background:rgb(58 110 66 / 13%);border:3px solid #245630}.edit-panel{display:none}.territory-control.editing .edit-panel{display:block}.property-buttons{display:flex;flex-wrap:wrap;gap:.35rem;margin:.55rem 0 .4rem}.property-button{appearance:none;border:1px solid #a97550;border-radius:999px;background:#fff9f1;color:#36291e;padding:.3rem .56rem;font:650 .78rem/1.1 inherit;cursor:pointer}.property-button.selected{border-color:#2f6f3e;background:#dfeedd;color:#174a25}.property-button.missing{border-color:#aaa;background:#f2f2f2;color:#777}.hint,.status{margin:.42rem 0 0;color:#59615b;font-size:.72rem;line-height:1.35}.leaflet-control-zoom a{width:38px;height:38px;line-height:38px}.leaflet-control-attribution{font-size:10px}.map-actions{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.55rem}.map-action{width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgb(0 0 0 / 22%);font-size:1.25rem;cursor:pointer;display:grid;place-items:center}.map-action.active{background:#245630;color:#fff}.map-action:disabled{opacity:.55;cursor:wait}.gps-dot{width:16px;height:16px;background:#1677ff;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 7px rgb(0 0 0 / 45%)}.inside{color:#245630;font-weight:700}.outside{color:#a4482c;font-weight:700}.wind-badge{background:rgb(255 255 255 / 94%);border:1px solid rgb(36 86 48 / 25%);border-radius:999px;padding:.34rem .55rem;box-shadow:0 1px 7px rgb(0 0 0 / 18%);font:750 .72rem/1 system-ui;color:#183c22;white-space:nowrap}.wind-arrow{display:inline-block;font-size:1.05rem;margin-right:.25rem;transform-origin:50% 50%}.inspect-popup{font:13px/1.45 system-ui;min-width:190px}.inspect-popup strong{font-size:14px}.inspect-popup .muted{color:#68736b}.boundary-note{margin-top:.25rem;font-size:.72rem;color:#3f5145}.home-link{display:inline-flex;margin-top:.5rem;color:#315f3b;text-decoration:none;font-size:.72rem;font-weight:720}@media(max-width:600px){.territory-control{padding:.68rem .72rem;max-width:min(20rem,calc(100vw - 4.5rem))}.map-action{width:44px;height:44px}}
</style></head><body><main id="map" aria-label="Grimstveit jaktområde"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script>
const STORAGE_KEY='grimstveit-selected-properties-v3',matrikkelEnheter=[[10,1],[10,2],[10,7],[11,2],[11,84],[12,2],[12,3],[12,4],[12,5],[12,6],[12,8],[13,4],[19,10],[8,1],[11,127],[10,13]],DEFAULT_SELECTION=['10/1','10/2','10/7','11/2','12/2','12/3','12/4','12/5','12/6','12/8','13/4','8/1','11/127','10/13'],TERRITORY_CENTER={lat:59.16,lon:8.50};
const map=L.map('map',{zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(map);map.setView([TERRITORY_CENTER.lat,TERRITORY_CENTER.lon],11);L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',{maxZoom:18,attribution:'<a href="https://www.kartverket.no/">Kartverket</a>'}).addTo(map);new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
const styles={viewSelected:{color:'#55715a',weight:.8,opacity:.32,fillColor:'#3a6e42',fillOpacity:.035},viewHidden:{color:'#000',weight:0,opacity:0,fillOpacity:0},editSelected:{color:'#2f6f3e',weight:2,opacity:.9,fillColor:'#4f9a5d',fillOpacity:.18},editUnselected:{color:'#a85f2e',weight:1.4,opacity:.8,fillColor:'#e89347',fillOpacity:.07}};
const chosen=new Set(loadSaved()),layers=new Map(),featuresByProperty=new Map(),areas=new Map(),missing=new Set(),loaded=new Set();let panel,territoryLayer=null,territoryFeature=null,editMode=false,finalFitDone=false,gpsMarker=null,gpsWatchId=null,lastGps=null,locateButton=null,windMarker=null,currentWind=null,inspectMarker=null;
addControl();addActionControl();setupMapInspect();matrikkelEnheter.forEach(([g,b])=>loadProperty(g,b));loadWind();
async function loadProperty(g,b){const key=`${g}/${b}`;try{const u=new URL('https://api.kartverket.no/eiendom/v1/geokoding');u.searchParams.set('kommunenummer','4030');u.searchParams.set('gardsnummer',g);u.searchParams.set('bruksnummer',b);u.searchParams.set('omrade','true');u.searchParams.set('utkoordsys','4258');const r=await fetch(u);if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();const fs=(d.features||[]).filter(f=>f.geometry&&['Polygon','MultiPolygon'].includes(f.geometry.type)).map(f=>({...f,properties:{...f.properties,_propertyKey:key}}));if(!fs.length)throw Error('ingen flater');areas.set(key,fs.reduce((s,f)=>s+geometryArea(f.geometry)/1000,0));loaded.add(key);featuresByProperty.set(key,fs);const group=L.geoJSON({type:'FeatureCollection',features:fs},{style:()=>styleFor(key),onEachFeature:(f,l)=>{l.on('add',()=>{const el=l.getElement();if(el){el.removeAttribute('tabindex');el.setAttribute('focusable','false')}});l.on('click',e=>{if(!editMode)return;L.DomEvent.stopPropagation(e.originalEvent);toggle(key)});l.bindTooltip(()=>editMode?`Gnr/Bnr ${key}`:'Grimstveit jaktområde',{sticky:true})}}).addTo(map);layers.set(key,group);apply(key);rebuildTerritory();update()}catch(e){console.warn(key,e);missing.add(key);update()}}
function styleFor(key){if(editMode)return chosen.has(key)?styles.editSelected:styles.editUnselected;return chosen.has(key)?styles.viewSelected:styles.viewHidden}function toggle(key){if(missing.has(key))return;chosen.has(key)?chosen.delete(key):chosen.add(key);save();layers.forEach((_,k)=>apply(k));rebuildTerritory();update()}function apply(key){const g=layers.get(key);if(!g)return;g.setStyle(styleFor(key));g.eachLayer(l=>{const el=l.getElement&&l.getElement();if(el){el.style.pointerEvents=editMode?'auto':'none';el.removeAttribute('tabindex');el.setAttribute('focusable','false')}})}function stripHoles(feature){if(!feature?.geometry)return feature;const g=feature.geometry;if(g.type==='Polygon')return {...feature,geometry:{...g,coordinates:g.coordinates.length?[g.coordinates[0]]:[]}};if(g.type==='MultiPolygon')return {...feature,geometry:{...g,coordinates:g.coordinates.map(p=>p.length?[p[0]]:[])}};return feature}
function rebuildTerritory(){if(territoryLayer)map.removeLayer(territoryLayer);const fs=[];chosen.forEach(k=>(featuresByProperty.get(k)||[]).forEach(f=>fs.push({type:'Feature',properties:{},geometry:f.geometry})));if(!fs.length){territoryFeature=null;return}let merged=null;try{if(window.turf)merged=fs.length===1?fs[0]:turf.union(turf.featureCollection(fs))}catch(e){console.warn('Union feilet',e)}territoryFeature=merged?stripHoles(merged):null;const data=territoryFeature||{type:'FeatureCollection',features:fs.map(stripHoles)};territoryLayer=L.geoJSON(data,{interactive:false,style:{color:'#245630',weight:3.6,opacity:.98,fillColor:'#3a6e42',fillOpacity:.10,lineJoin:'round'}}).addTo(map);if(!editMode)territoryLayer.bringToFront();if(lastGps)updateGpsStatus(lastGps)}
function setEditMode(v){editMode=v;panel.classList.toggle('editing',v);const b=panel.querySelector('.mode-button');b.classList.toggle('active',v);b.textContent=v?'Ferdig':'Rediger';layers.forEach((_,k)=>apply(k));rebuildTerritory();update()}function total(){let n=0;chosen.forEach(k=>n+=areas.get(k)||0);return n}function format(v){return Math.round(v).toLocaleString('nb-NO')}function loadSaved(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'),valid=new Set(matrikkelEnheter.map(([g,b])=>`${g}/${b}`));return Array.isArray(x)&&x.length&&x.every(k=>valid.has(k))?x:DEFAULT_SELECTION}catch{return DEFAULT_SELECTION}}function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...chosen]))}catch{}}
function addControl(){const c=L.control({position:'topleft'});c.onAdd=()=>{panel=L.DomUtil.create('section','territory-control');panel.innerHTML=`<div class="header"><div><div class="title">Grimstveit jaktområde</div><div class="sub">Kyrkjebygdheia · Nissedal</div></div><button class="mode-button" type="button">Rediger</button></div><div class="summary"><strong>Grimstveit</strong>Laster jaktområdet…</div><div class="legend"><span class="legend-swatch"></span><span>Jaktområde</span></div><div class="boundary-note">Aktiver posisjon for å se avstand til jaktgrensen.</div><a class="home-link" href="/">← Til forsiden</a><div class="edit-panel"><p class="hint">Rediger kun hvis området skal korrigeres. Trykk på eiendom eller gnr/bnr.</p><div class="property-buttons">${matrikkelEnheter.map(([g,b])=>`<button class="property-button" type="button" data-key="${g}/${b}">${g}/${b}</button>`).join('')}</div><p class="status"></p></div>`;L.DomEvent.disableClickPropagation(panel);L.DomEvent.disableScrollPropagation(panel);panel.querySelector('.mode-button').onclick=()=>setEditMode(!editMode);panel.querySelectorAll('.property-button').forEach(btn=>btn.onclick=e=>{e.preventDefault();toggle(btn.dataset.key)});return panel};c.addTo(map)}
function addActionControl(){const c=L.control({position:'bottomright'});c.onAdd=()=>{const wrap=L.DomUtil.create('div','map-actions');locateButton=L.DomUtil.create('button','map-action',wrap);locateButton.type='button';locateButton.title='Min posisjon';locateButton.setAttribute('aria-label','Vis min posisjon');locateButton.innerHTML='⌖';L.DomEvent.disableClickPropagation(wrap);locateButton.addEventListener('click',startLocate);return wrap};c.addTo(map)}
function startLocate(){if(!navigator.geolocation){showLocationError('Denne enheten støtter ikke posisjon.');return}locateButton.disabled=true;locateButton.classList.add('active');if(gpsWatchId!==null)navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=navigator.geolocation.watchPosition(onGps,onGpsError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function onGps(pos){locateButton.disabled=false;const {latitude:lat,longitude:lon,accuracy}=pos.coords;lastGps={lat,lon,accuracy};if(!gpsMarker){gpsMarker=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:1000}).addTo(map)}else{gpsMarker.setLatLng([lat,lon])}gpsMarker.bindTooltip(()=>gpsTooltip(lastGps),{direction:'top',offset:[0,-10]});updateGpsStatus(lastGps);map.setView([lat,lon],Math.max(map.getZoom(),14))}
function onGpsError(err){locateButton.disabled=false;locateButton.classList.remove('active');showLocationError(err.code===1?'Posisjonstilgang ble avslått. Tillat stedstilgang og prøv igjen.':err.code===2?'Fant ikke posisjonen din akkurat nå.':'Posisjonen tok for lang tid å hente.')}function showLocationError(msg){if(panel)panel.querySelector('.boundary-note').textContent=msg}
function boundaryDistance(p){try{if(!territoryFeature||!window.turf)return null;const pt=turf.point([p.lon,p.lat]),lines=turf.polygonToLine(territoryFeature),nearest=turf.nearestPointOnLine(lines,pt,{units:'kilometers'});return nearest.properties.dist*1000}catch(e){return null}}
function gpsTooltip(p){const inside=isInsideTerritory(p),bd=boundaryDistance(p);return `<strong>Min posisjon</strong><br>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<br>Nøyaktighet ±${Math.round(p.accuracy)} m<br><span class="${inside?'inside':'outside'}">${inside?'Innenfor jaktområdet':'Utenfor jaktområdet'}</span>${bd!=null?`<br>${formatDistance(bd)} til grensen`:''}`}function updateGpsStatus(p){if(gpsMarker)gpsMarker.setTooltipContent(gpsTooltip(p));const bd=boundaryDistance(p);if(panel)panel.querySelector('.boundary-note').innerHTML=bd==null?'Avstand til jaktgrense beregnes når området er klart.':`<strong>${formatDistance(bd)}</strong> til nærmeste jaktgrense`;}function isInsideTerritory(p){try{return !!(territoryFeature&&window.turf&&turf.booleanPointInPolygon(turf.point([p.lon,p.lat]),territoryFeature))}catch{return false}}
function setupMapInspect(){map.on('contextmenu',e=>{L.DomEvent.preventDefault(e.originalEvent);inspectPoint(e.latlng)})}
function inspectPoint(ll){const p={lat:ll.lat,lon:ll.lng},dist=lastGps?distanceMeters(lastGps,p):null,bear=lastGps?bearing(lastGps,p):null,inside=isInsideTerritory(p),wind=currentWind?`${windDirection(currentWind.dir)} ${Math.round(currentWind.speed)} m/s`:null;const html=`<div class="inspect-popup"><strong>Valgt punkt</strong><br><span class="muted">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</span><br>${inside?'<span class="inside">Innenfor jaktområdet</span>':'<span class="outside">Utenfor jaktområdet</span>'}${dist!=null?`<br><b>${formatDistance(dist)}</b> fra deg · ${Math.round(bear).toString().padStart(3,'0')}°`:''}${wind?`<br>Vind ${wind}`:''}</div>`;if(inspectMarker)map.removeLayer(inspectMarker);inspectMarker=L.circleMarker(ll,{radius:6,color:'#6b3f1d',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map).bindPopup(html,{closeButton:true}).openPopup()}
function bearing(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lon-a.lon)*r,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}function distanceMeters(a,b){const R=6371000,toRad=Math.PI/180,dLat=(b.lat-a.lat)*toRad,dLon=(b.lon-a.lon)*toRad,lat1=a.lat*toRad,lat2=b.lat*toRad,h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function formatDistance(m){return m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1).replace('.',',')} km`}
async function loadWind(){try{const r=await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${TERRITORY_CENTER.lat}&lon=${TERRITORY_CENTER.lon}`);if(!r.ok)throw Error(`MET ${r.status}`);const data=await r.json(),d=data.properties.timeseries?.[0]?.data?.instant?.details||{};currentWind={dir:d.wind_from_direction,speed:d.wind_speed||0,gust:d.wind_speed_of_gust};showWindOnMap(currentWind)}catch(e){console.warn('Vinddata feilet',e)}}
function showWindOnMap(w){if(windMarker)map.removeLayer(windMarker);if(w.dir==null)return;const rotation=(w.dir+180)%360,html=`<div class="wind-badge"><span class="wind-arrow" style="transform:rotate(${rotation}deg)">↑</span>${windDirection(w.dir)} ${Math.round(w.speed)} m/s</div>`;windMarker=L.marker(map.getCenter(),{interactive:false,zIndexOffset:700,icon:L.divIcon({className:'',html,iconSize:[100,28],iconAnchor:[50,14]})}).addTo(map);const recenter=()=>windMarker&&windMarker.setLatLng(map.getCenter());map.off('move zoom',window._windRecenter);window._windRecenter=recenter;map.on('move zoom',recenter)}function windDirection(deg){if(deg==null)return '–';return ['N','NØ','Ø','SØ','S','SV','V','NV'][Math.round(deg/45)%8]}
function update(){if(!panel)return;panel.querySelectorAll('.property-button').forEach(btn=>{const k=btn.dataset.key;btn.classList.toggle('selected',chosen.has(k));btn.classList.toggle('missing',missing.has(k));btn.textContent=k+(missing.has(k)?' ⚠':'')});const done=loaded.size+missing.size,a=total();panel.querySelector('.summary').innerHTML=`<strong>${a?format(a)+' daa':'Grimstveit'}</strong>${chosen.size} matrikkelenheter i jaktområdet`;panel.querySelector('.status').textContent=done<matrikkelEnheter.length?`Laster ${done} av ${matrikkelEnheter.length}…`:(missing.size?`Ingen geometri for: ${[...missing].join(', ')}`:'Kartdata lastet.');if(done===matrikkelEnheter.length&&!finalFitDone&&territoryLayer){const b=territoryLayer.getBounds();if(b.isValid()){map.fitBounds(b,{padding:[42,42],maxZoom:14});finalFitDone=true}}}function geometryArea(g){if(g.type==='Polygon')return polygonArea(g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.reduce((s,p)=>s+polygonArea(p),0);return 0}function polygonArea(rs){if(!rs?.length)return 0;return Math.max(0,Math.abs(ringArea(rs[0]))-rs.slice(1).reduce((s,r)=>s+Math.abs(ringArea(r)),0))}function ringArea(cs){const R=6378137,t=Math.PI/180;let a=0;for(let i=0;i<cs.length;i++){const x=cs[i],y=cs[(i+1)%cs.length];a+=(y[0]*t-x[0]*t)*(2+Math.sin(x[1]*t)+Math.sin(y[1]*t))}return a*R*R/2}
</script></body></html>
