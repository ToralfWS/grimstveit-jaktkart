<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e8">
  <title>Grimstveit jaktkart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#d7e1d3}
    #map{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
    .territory-control{max-width:min(24rem,calc(100vw - 5rem));border:0;border-radius:.85rem;background:rgb(255 255 255 / 96%);box-shadow:0 2px 14px rgb(0 0 0 / 22%);color:#172119;padding:.8rem .9rem;backdrop-filter:blur(6px)}
    .territory-control .header{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
    .territory-control .title{font-size:.98rem;font-weight:750}.territory-control .sub{font-size:.72rem;color:#647066;margin-top:.08rem}
    .mode-button{appearance:none;border:1px solid #315f3b;border-radius:.55rem;background:#fff;color:#214b2b;padding:.42rem .62rem;font:700 .76rem/1 inherit;cursor:pointer;white-space:nowrap}
    .mode-button.active{background:#315f3b;color:#fff}
    .summary{margin:.7rem 0 .55rem;padding:.58rem .65rem;border-radius:.6rem;background:#eef6ec;border:1px solid #b9d1b3;font-size:.8rem;line-height:1.35}.summary strong{display:block;font-size:.98rem}
    .edit-panel{display:none}.territory-control.editing .edit-panel{display:block}
    .property-buttons{display:flex;flex-wrap:wrap;gap:.35rem;margin:.55rem 0 .4rem}.property-button{appearance:none;border:1px solid #a97550;border-radius:999px;background:#fff9f1;color:#36291e;padding:.3rem .56rem;font:650 .78rem/1.1 inherit;cursor:pointer;touch-action:manipulation}.property-button.selected{border-color:#2f6f3e;background:#dfeedd;color:#174a25}.property-button.missing{border-color:#aaa;background:#f2f2f2;color:#777}
    .hint,.status{margin:.42rem 0 0;color:#59615b;font-size:.72rem;line-height:1.35}.hint{color:#33423a}
    .legend{display:flex;align-items:center;gap:.42rem;margin-top:.5rem;font-size:.72rem;color:#526055}.legend-swatch{width:1.25rem;height:.65rem;border-radius:.2rem;background:rgb(71 119 77 / 20%);border:2px solid #285a33}
    .leaflet-interactive{cursor:pointer}.leaflet-control-zoom a{width:36px;height:36px;line-height:36px}.leaflet-control-attribution{font-size:10px}
    @media(max-width:600px){.territory-control{padding:.68rem .72rem;max-width:min(21rem,calc(100vw - 4.5rem))}.territory-control .title{font-size:.92rem}}
  </style>
</head>
<body>
<main id="map" aria-label="Grimstveit jaktområde"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
const TARGET_DAA=10606,STORAGE_KEY='grimstveit-selected-properties-v1';
const matrikkelEnheter=[[10,1],[10,2],[10,7],[11,2],[11,84],[12,2],[12,3],[12,4],[12,5],[12,6],[12,8],[13,4],[19,10],[8,1],[11,127],[10,13]];
const map=L.map('map',{zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(map);map.setView([59.16,8.50],11);
L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',{maxZoom:18,attribution:'<a href="https://www.kartverket.no/">Kartverket</a>'}).addTo(map);
new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));

const styles={
  viewSelected:{color:'#748177',weight:1.05,opacity:.58,fillColor:'#4b7650',fillOpacity:.045},
  viewHidden:{color:'#000',weight:0,opacity:0,fillOpacity:0},
  editSelected:{color:'#2f6f3e',weight:2.2,opacity:.95,fillColor:'#4f9a5d',fillOpacity:.20},
  editUnselected:{color:'#a85f2e',weight:1.45,opacity:.8,fillColor:'#e89347',fillOpacity:.075}
};
const chosen=new Set(loadSaved()),layers=new Map(),featuresByProperty=new Map(),areas=new Map(),missing=new Set(),loaded=new Set();
let bounds=null,panel,territoryLayer=null,editMode=chosen.size===0;
addControl();matrikkelEnheter.forEach(([g,b])=>loadProperty(g,b));

async function loadProperty(g,b){
  const key=`${g}/${b}`;
  try{
    const u=new URL('https://api.kartverket.no/eiendom/v1/geokoding');
    u.searchParams.set('kommunenummer','4030');u.searchParams.set('gardsnummer',g);u.searchParams.set('bruksnummer',b);u.searchParams.set('omrade','true');u.searchParams.set('utkoordsys','4258');
    const r=await fetch(u);if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();
    const fs=(d.features||[]).filter(f=>f.geometry&&['Polygon','MultiPolygon'].includes(f.geometry.type)).map(f=>({...f,properties:{...f.properties,_propertyKey:key}}));
    if(!fs.length)throw Error('ingen flater');
    const daa=fs.reduce((s,f)=>s+geometryArea(f.geometry)/1000,0);areas.set(key,daa);loaded.add(key);featuresByProperty.set(key,fs);
    const group=L.geoJSON({type:'FeatureCollection',features:fs},{style:()=>styleFor(key),onEachFeature:(f,l)=>{l.on('click',e=>{if(!editMode)return;L.DomEvent.stopPropagation(e.originalEvent);toggle(key)});l.bindTooltip(()=>editMode?`Gnr/Bnr ${key} · ca. ${format(daa)} daa`:'Grimstveit jaktområde',{sticky:true});}}).addTo(map);
    layers.set(key,group);const bnd=group.getBounds();if(bnd.isValid()){bounds=bounds?bounds.extend(bnd):L.latLngBounds(bnd)}
    apply(key);rebuildTerritory();update();
  }catch(e){console.warn(key,e);missing.add(key);update()}
}

function styleFor(key){if(editMode)return chosen.has(key)?styles.editSelected:styles.editUnselected;return chosen.has(key)?styles.viewSelected:styles.viewHidden}
function toggle(key){if(missing.has(key))return;chosen.has(key)?chosen.delete(key):chosen.add(key);save();layers.forEach((_,k)=>apply(k));rebuildTerritory();update()}
function apply(key){const g=layers.get(key);if(!g)return;g.setStyle(styleFor(key));if(chosen.has(key))g.bringToFront()}

function rebuildTerritory(){
  if(territoryLayer){map.removeLayer(territoryLayer);territoryLayer=null}
  const selectedFeatures=[];chosen.forEach(key=>{const fs=featuresByProperty.get(key)||[];selectedFeatures.push(...fs.map(f=>({type:'Feature',properties:{},geometry:f.geometry}))) });
  if(!selectedFeatures.length)return;
  let merged=null;
  try{
    if(window.turf&&selectedFeatures.length===1) merged=selectedFeatures[0];
    else if(window.turf) merged=turf.union(turf.featureCollection(selectedFeatures));
  }catch(err){console.warn('Kunne ikke slå sammen jaktområdet:',err)}
  const data=merged||{type:'FeatureCollection',features:selectedFeatures};
  territoryLayer=L.geoJSON(data,{interactive:false,style:{color:'#255a31',weight:4.2,opacity:1,fillColor:'#4b7650',fillOpacity:.12,lineJoin:'round'}}).addTo(map);
  territoryLayer.bringToBack();
  // Keep the basemap behind everything, then property layers over the area fill.
  layers.forEach((g,k)=>{if(chosen.has(k))g.bringToFront()});
}

function setEditMode(value){editMode=value;panel.classList.toggle('editing',editMode);panel.querySelector('.mode-button').classList.toggle('active',editMode);panel.querySelector('.mode-button').textContent=editMode?'Ferdig':'Rediger område';layers.forEach((_,k)=>apply(k));rebuildTerritory();update()}
function total(){let n=0;chosen.forEach(k=>n+=areas.get(k)||0);return n}function format(v){return Math.round(v).toLocaleString('nb-NO')}
function loadSaved(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...chosen]))}catch{}}

function addControl(){
  const c=L.control({position:'topleft'});c.onAdd=()=>{
    panel=L.DomUtil.create('section','territory-control');
    panel.innerHTML=`<div class="header"><div><div class="title">Grimstveit jaktområde</div><div class="sub">Kyrkjebygdheia · Nissedal</div></div><button class="mode-button" type="button">Rediger område</button></div><div class="summary"><strong>Valgt: 0 daa</strong>0 matrikkelenheter</div><div class="legend"><span class="legend-swatch"></span><span>Tydelig yttergrense, diskrete interne grenser</span></div><div class="edit-panel"><p class="hint">Trykk på en eiendom i kartet eller på gnr/bnr. Hele matrikkelenheten velges samtidig.</p><div class="property-buttons">${matrikkelEnheter.map(([g,b])=>`<button class="property-button" type="button" data-key="${g}/${b}">${g}/${b}</button>`).join('')}</div><p class="status">Henter eiendommer…</p></div>`;
    L.DomEvent.disableClickPropagation(panel);L.DomEvent.disableScrollPropagation(panel);
    panel.querySelector('.mode-button').addEventListener('click',()=>setEditMode(!editMode));
    panel.querySelectorAll('.property-button').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggle(btn.dataset.key)}));
    panel.classList.toggle('editing',editMode);panel.querySelector('.mode-button').classList.toggle('active',editMode);panel.querySelector('.mode-button').textContent=editMode?'Ferdig':'Rediger område';
    return panel;
  };c.addTo(map)
}

function update(){
  if(!panel)return;
  panel.querySelectorAll('.property-button').forEach(btn=>{const k=btn.dataset.key;btn.classList.toggle('selected',chosen.has(k));btn.classList.toggle('missing',missing.has(k));btn.textContent=k+(missing.has(k)?' ⚠':'')});
  const a=total();panel.querySelector('.summary').innerHTML=`<strong>${format(a)} daa</strong>${chosen.size} matrikkelenheter valgt`;
  const done=loaded.size+missing.size;panel.querySelector('.status').textContent=done<matrikkelEnheter.length?`Lastet ${done} av ${matrikkelEnheter.length} matrikkelenheter…`:(missing.size?`Ingen geometri for: ${[...missing].join(', ')}`:'Alle matrikkelenheter er lastet.');
  if(bounds&&bounds.isValid()&&done===matrikkelEnheter.length&&chosen.size===0)map.fitBounds(bounds,{padding:[24,24],maxZoom:14});
  if(territoryLayer&&!editMode){const b=territoryLayer.getBounds();if(b.isValid())map.fitBounds(b,{padding:[34,34],maxZoom:14})}
}

function geometryArea(g){if(g.type==='Polygon')return polygonArea(g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.reduce((s,p)=>s+polygonArea(p),0);return 0}
function polygonArea(rs){if(!rs?.length)return 0;return Math.max(0,Math.abs(ringArea(rs[0]))-rs.slice(1).reduce((s,r)=>s+Math.abs(ringArea(r)),0))}
function ringArea(cs){const R=6378137,t=Math.PI/180;let a=0;for(let i=0;i<cs.length;i++){const x=cs[i],y=cs[(i+1)%cs.length];a+=(y[0]*t-x[0]*t)*(2+Math.sin(x[1]*t)+Math.sin(y[1]*t))}return a*R*R/2}
</script>
</body></html>
