<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e8"><title>Grimstveit jaktkart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#d7e1d3}#map{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
    .territory-control{max-width:min(22rem,calc(100vw - 5rem));border:0;border-radius:.85rem;background:rgb(255 255 255 / 96%);box-shadow:0 2px 14px rgb(0 0 0 / 20%);color:#172119;padding:.8rem .9rem;backdrop-filter:blur(6px)}
    .header{display:flex;align-items:center;justify-content:space-between;gap:.75rem}.title{font-size:1rem;font-weight:760}.sub{font-size:.72rem;color:#647066;margin-top:.08rem}.mode-button{appearance:none;border:1px solid #315f3b;border-radius:.55rem;background:#fff;color:#214b2b;padding:.42rem .62rem;font:700 .76rem/1 inherit;cursor:pointer;white-space:nowrap}.mode-button.active{background:#315f3b;color:#fff}
    .summary{margin:.7rem 0 .45rem;padding:.58rem .65rem;border-radius:.6rem;background:#eef6ec;border:1px solid #b9d1b3;font-size:.78rem;line-height:1.35}.summary strong{display:block;font-size:.98rem}.legend{display:flex;align-items:center;gap:.42rem;margin-top:.45rem;font-size:.72rem;color:#526055}.legend-swatch{width:1.3rem;height:.65rem;border-radius:.2rem;background:rgb(58 110 66 / 13%);border:3px solid #245630}
    .edit-panel{display:none}.territory-control.editing .edit-panel{display:block}.property-buttons{display:flex;flex-wrap:wrap;gap:.35rem;margin:.55rem 0 .4rem}.property-button{appearance:none;border:1px solid #a97550;border-radius:999px;background:#fff9f1;color:#36291e;padding:.3rem .56rem;font:650 .78rem/1.1 inherit;cursor:pointer}.property-button.selected{border-color:#2f6f3e;background:#dfeedd;color:#174a25}.property-button.missing{border-color:#aaa;background:#f2f2f2;color:#777}.hint,.status{margin:.42rem 0 0;color:#59615b;font-size:.72rem;line-height:1.35}
    .leaflet-control-zoom a{width:38px;height:38px;line-height:38px}.leaflet-control-attribution{font-size:10px}
    .map-actions{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.55rem}.map-action{width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgb(0 0 0 / 22%);font-size:1.25rem;cursor:pointer;display:grid;place-items:center}.map-action.active{background:#245630;color:#fff}.map-action:disabled{opacity:.55;cursor:wait}
    .gps-dot{width:16px;height:16px;background:#1677ff;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 7px rgb(0 0 0 / 45%)}
    .gps-pulse{width:24px;height:24px;border-radius:50%;background:rgb(22 119 255 / 20%);border:1px solid rgb(22 119 255 / 45%)}
    .weather-card{min-width:260px;max-width:310px;border:0;border-radius:.85rem;background:rgb(255 255 255 / 96%);box-shadow:0 2px 14px rgb(0 0 0 / 20%);padding:.72rem .8rem;color:#172119;backdrop-filter:blur(6px)}
    .weather-top{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start}.weather-title{font-size:.76rem;font-weight:760}.weather-source{font-size:.62rem;color:#6a726b}.weather-main{font-size:1.35rem;font-weight:780;line-height:1.1;margin-top:.2rem}.weather-meta{font-size:.74rem;line-height:1.45;margin-top:.28rem;color:#33423a}.weather-hours{display:flex;gap:.45rem;margin-top:.55rem;padding-top:.5rem;border-top:1px solid #dde4dd;overflow-x:auto}.weather-hour{min-width:58px;font-size:.67rem;line-height:1.35;color:#445046}.weather-hour strong{display:block;font-size:.72rem;color:#172119}.weather-error{font-size:.72rem;color:#6b4b3f}.inside{color:#245630;font-weight:700}.outside{color:#a4482c;font-weight:700}
    @media(max-width:600px){.territory-control{padding:.68rem .72rem;max-width:min(20rem,calc(100vw - 4.5rem))}.weather-card{min-width:220px;max-width:260px;padding:.62rem .7rem}.map-action{width:44px;height:44px}}
  </style>
</head>
<body><main id="map" aria-label="Grimstveit jaktområde"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script>
const STORAGE_KEY='grimstveit-selected-properties-v2';
const matrikkelEnheter=[[10,1],[10,2],[10,7],[11,2],[11,84],[12,2],[12,3],[12,4],[12,5],[12,6],[12,8],[13,4],[19,10],[8,1],[11,127],[10,13]];
const DEFAULT_SELECTION=['10/1','10/2','10/7','11/2','12/2','12/3','12/4','12/5','12/6','12/8','13/4','8/1','11/127','10/13'];
const TERRITORY_CENTER={lat:59.16,lon:8.50};
const map=L.map('map',{zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(map);map.setView([TERRITORY_CENTER.lat,TERRITORY_CENTER.lon],11);L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',{maxZoom:18,attribution:'<a href="https://www.kartverket.no/">Kartverket</a>'}).addTo(map);new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
const styles={viewSelected:{color:'#55715a',weight:.65,opacity:.22,fillColor:'#3a6e42',fillOpacity:.025},viewHidden:{color:'#000',weight:0,opacity:0,fillOpacity:0},editSelected:{color:'#2f6f3e',weight:2,opacity:.9,fillColor:'#4f9a5d',fillOpacity:.18},editUnselected:{color:'#a85f2e',weight:1.4,opacity:.8,fillColor:'#e89347',fillOpacity:.07}};
const chosen=new Set(loadSaved()),layers=new Map(),featuresByProperty=new Map(),areas=new Map(),missing=new Set(),loaded=new Set();let panel,territoryLayer=null,territoryFeature=null,editMode=false,finalFitDone=false;
let gpsMarker=null,gpsAccuracy=null,gpsWatchId=null,lastGps=null,lastWeatherPoint=null,weatherPanel=null,locateButton=null;
addControl();addActionControl();addWeatherControl();matrikkelEnheter.forEach(([g,b])=>loadProperty(g,b));loadWeather(TERRITORY_CENTER.lat,TERRITORY_CENTER.lon,'jaktområdet');

async function loadProperty(g,b){const key=`${g}/${b}`;try{const u=new URL('https://api.kartverket.no/eiendom/v1/geokoding');u.searchParams.set('kommunenummer','4030');u.searchParams.set('gardsnummer',g);u.searchParams.set('bruksnummer',b);u.searchParams.set('omrade','true');u.searchParams.set('utkoordsys','4258');const r=await fetch(u);if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();const fs=(d.features||[]).filter(f=>f.geometry&&['Polygon','MultiPolygon'].includes(f.geometry.type)).map(f=>({...f,properties:{...f.properties,_propertyKey:key}}));if(!fs.length)throw Error('ingen flater');areas.set(key,fs.reduce((s,f)=>s+geometryArea(f.geometry)/1000,0));loaded.add(key);featuresByProperty.set(key,fs);const group=L.geoJSON({type:'FeatureCollection',features:fs},{style:()=>styleFor(key),onEachFeature:(f,l)=>{l.on('click',e=>{if(!editMode)return;L.DomEvent.stopPropagation(e.originalEvent);toggle(key)});l.bindTooltip(()=>editMode?`Gnr/Bnr ${key}`:'Grimstveit jaktområde',{sticky:true})}}).addTo(map);layers.set(key,group);apply(key);rebuildTerritory();update()}catch(e){console.warn(key,e);missing.add(key);update()}}
function styleFor(key){if(editMode)return chosen.has(key)?styles.editSelected:styles.editUnselected;return chosen.has(key)?styles.viewSelected:styles.viewHidden}
function toggle(key){if(missing.has(key))return;chosen.has(key)?chosen.delete(key):chosen.add(key);save();layers.forEach((_,k)=>apply(k));rebuildTerritory();update()}
function apply(key){const g=layers.get(key);if(g)g.setStyle(styleFor(key))}
function stripHoles(feature){if(!feature?.geometry)return feature;const g=feature.geometry;if(g.type==='Polygon')return {...feature,geometry:{...g,coordinates:g.coordinates.length?[g.coordinates[0]]:[]}};if(g.type==='MultiPolygon')return {...feature,geometry:{...g,coordinates:g.coordinates.map(p=>p.length?[p[0]]:[])}};return feature}
function rebuildTerritory(){if(territoryLayer){map.removeLayer(territoryLayer);territoryLayer=null}const fs=[];chosen.forEach(k=>(featuresByProperty.get(k)||[]).forEach(f=>fs.push({type:'Feature',properties:{},geometry:f.geometry})));if(!fs.length){territoryFeature=null;return}let merged=null;try{if(window.turf)merged=fs.length===1?fs[0]:turf.union(turf.featureCollection(fs))}catch(e){console.warn('Union feilet',e)}territoryFeature=merged?stripHoles(merged):null;const data=territoryFeature||{type:'FeatureCollection',features:fs.map(stripHoles)};territoryLayer=L.geoJSON(data,{interactive:false,style:{color:'#245630',weight:3.5,opacity:.97,fillColor:'#3a6e42',fillOpacity:.09,lineJoin:'round'}}).addTo(map);layers.forEach((g,k)=>{if(chosen.has(k))g.bringToFront()});if(!editMode)territoryLayer.bringToFront();if(lastGps)updateGpsStatus(lastGps)}
function setEditMode(v){editMode=v;panel.classList.toggle('editing',v);const b=panel.querySelector('.mode-button');b.classList.toggle('active',v);b.textContent=v?'Ferdig':'Rediger';layers.forEach((_,k)=>apply(k));rebuildTerritory();update()}
function total(){let n=0;chosen.forEach(k=>n+=areas.get(k)||0);return n}function format(v){return Math.round(v).toLocaleString('nb-NO')}
function loadSaved(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return Array.isArray(x)?x:DEFAULT_SELECTION}catch{return DEFAULT_SELECTION}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...chosen]))}catch{}}
function addControl(){const c=L.control({position:'topleft'});c.onAdd=()=>{panel=L.DomUtil.create('section','territory-control');panel.innerHTML=`<div class="header"><div><div class="title">Grimstveit jaktområde</div><div class="sub">Kyrkjebygdheia · Nissedal</div></div><button class="mode-button" type="button">Rediger</button></div><div class="summary"><strong>Grimstveit</strong>Laster jaktområdet…</div><div class="legend"><span class="legend-swatch"></span><span>Jaktområde</span></div><div class="edit-panel"><p class="hint">Rediger kun hvis området skal korrigeres. Trykk på eiendom eller gnr/bnr.</p><div class="property-buttons">${matrikkelEnheter.map(([g,b])=>`<button class="property-button" type="button" data-key="${g}/${b}">${g}/${b}</button>`).join('')}</div><p class="status"></p></div>`;L.DomEvent.disableClickPropagation(panel);L.DomEvent.disableScrollPropagation(panel);panel.querySelector('.mode-button').onclick=()=>setEditMode(!editMode);panel.querySelectorAll('.property-button').forEach(btn=>btn.onclick=e=>{e.preventDefault();toggle(btn.dataset.key)});return panel};c.addTo(map)}
function addActionControl(){const c=L.control({position:'bottomright'});c.onAdd=()=>{const wrap=L.DomUtil.create('div','map-actions');locateButton=L.DomUtil.create('button','map-action',wrap);locateButton.type='button';locateButton.title='Min posisjon';locateButton.setAttribute('aria-label','Vis min posisjon');locateButton.innerHTML='⌖';L.DomEvent.disableClickPropagation(wrap);locateButton.addEventListener('click',startLocate);return wrap};c.addTo(map)}
function addWeatherControl(){const c=L.control({position:'topright'});c.onAdd=()=>{weatherPanel=L.DomUtil.create('section','weather-card');weatherPanel.innerHTML='<div class="weather-error">Henter vær…</div>';L.DomEvent.disableClickPropagation(weatherPanel);L.DomEvent.disableScrollPropagation(weatherPanel);return weatherPanel};c.addTo(map)}
function startLocate(){if(!navigator.geolocation){showLocationError('Denne enheten støtter ikke posisjon.');return}locateButton.disabled=true;locateButton.classList.add('active');if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null}gpsWatchId=navigator.geolocation.watchPosition(onGps,onGpsError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function onGps(pos){locateButton.disabled=false;const {latitude:lat,longitude:lon,accuracy}=pos.coords;lastGps={lat,lon,accuracy};if(!gpsMarker){gpsAccuracy=L.circle([lat,lon],{radius:accuracy,color:'#1677ff',weight:1,opacity:.45,fillColor:'#1677ff',fillOpacity:.08,interactive:false}).addTo(map);gpsMarker=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:1000}).addTo(map)}else{gpsMarker.setLatLng([lat,lon]);gpsAccuracy.setLatLng([lat,lon]).setRadius(accuracy)}gpsMarker.bindTooltip(()=>gpsTooltip(lastGps),{direction:'top',offset:[0,-10]});updateGpsStatus(lastGps);map.setView([lat,lon],Math.max(map.getZoom(),14));if(!lastWeatherPoint||distanceMeters(lastWeatherPoint,{lat,lon})>1000){lastWeatherPoint={lat,lon};loadWeather(lat,lon,'din posisjon')}}
function onGpsError(err){locateButton.disabled=false;locateButton.classList.remove('active');const msg=err.code===1?'Posisjonstilgang ble avslått. Tillat stedstilgang i nettleseren og prøv igjen.':err.code===2?'Fant ikke posisjonen din akkurat nå.':'Posisjonen tok for lang tid å hente.';showLocationError(msg)}
function showLocationError(msg){if(panel){const s=panel.querySelector('.summary');s.innerHTML+=`<div class="weather-error" style="margin-top:.35rem">${msg}</div>`}}
function gpsTooltip(p){const status=insideTerritory(p.lat,p.lon);return `<strong>Min posisjon</strong><br>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}<br>Nøyaktighet ca. ${Math.round(p.accuracy)} m${status===null?'':`<br><span class="${status?'inside':'outside'}">${status?'Innenfor':'Utenfor'} jaktområdet</span>`}`}
function updateGpsStatus(p){if(!gpsMarker)return;gpsMarker.setTooltipContent(gpsTooltip(p))}
function insideTerritory(lat,lon){if(!territoryFeature||!window.turf)return null;try{return turf.booleanPointInPolygon(turf.point([lon,lat]),territoryFeature)}catch{return null}}
function distanceMeters(a,b){const R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLon=(b.lon-a.lon)*t,x=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
async function loadWeather(lat,lon,label){if(!weatherPanel)return;weatherPanel.innerHTML='<div class="weather-error">Henter vær…</div>';try{const u=`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}`;const r=await fetch(u);if(!r.ok)throw Error(`MET ${r.status}`);const d=await r.json();renderMetWeather(d,label);return}catch(e){console.warn('MET Norway feilet, bruker reservekilde',e)}try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=ms&timezone=Europe%2FOslo&forecast_days=2`;const r=await fetch(u);if(!r.ok)throw Error(`Open-Meteo ${r.status}`);renderOpenMeteo(await r.json(),label)}catch(e){console.warn(e);weatherPanel.innerHTML='<div class="weather-error">Kunne ikke hente vær akkurat nå.</div>'}}
function renderMetWeather(d,label){const t=d?.properties?.timeseries||[];if(!t.length)throw Error('Tom værrespons');const now=t[0],instant=now.data.instant.details||{},next=now.data.next_1_hours?.details||now.data.next_6_hours?.details||{},hours=t.slice(0,6);const temp=instant.air_temperature,wind=instant.wind_speed,dir=instant.wind_from_direction,gust=instant.wind_speed_of_gust,precip=next.precipitation_amount;weatherPanel.innerHTML=`<div class="weather-top"><div><div class="weather-title">Vær · ${label}</div><div class="weather-source">MET Norway / Yr-data</div></div><div class="weather-main">${round1(temp)}°</div></div><div class="weather-meta">Vind ${windDir(dir)} ${round1(wind)} m/s${gust!=null?` · kast ${round1(gust)}`:''}${precip!=null?`<br>Nedbør neste time ${round1(precip)} mm`:''}</div><div class="weather-hours">${hours.map(x=>metHour(x)).join('')}</div>`}
function metHour(x){const d=x.data.instant.details||{},p=x.data.next_1_hours?.details?.precipitation_amount;return `<div class="weather-hour"><strong>${hourLabel(x.time)}</strong>${round1(d.air_temperature)}°<br>${windDir(d.wind_from_direction)} ${round1(d.wind_speed)}<br>${p==null?'':round1(p)+' mm'}</div>`}
function renderOpenMeteo(d,label){const c=d.current||{},times=d.hourly?.time||[],idx=Math.max(0,times.findIndex(x=>x>=c.time)),hours=times.slice(idx,idx+6).map((time,i)=>{const j=idx+i;return {time,temp:d.hourly.temperature_2m[j],wind:d.hourly.wind_speed_10m[j],dir:d.hourly.wind_direction_10m[j],gust:d.hourly.wind_gusts_10m[j],pop:d.hourly.precipitation_probability[j],precip:d.hourly.precipitation[j]}});weatherPanel.innerHTML=`<div class="weather-top"><div><div class="weather-title">Vær · ${label}</div><div class="weather-source">Værdata</div></div><div class="weather-main">${round1(c.temperature_2m)}°</div></div><div class="weather-meta">Vind ${windDir(c.wind_direction_10m)} ${round1(c.wind_speed_10m)} m/s${c.wind_gusts_10m!=null?` · kast ${round1(c.wind_gusts_10m)}`:''}<br>Nedbør nå ${round1(c.precipitation||0)} mm</div><div class="weather-hours">${hours.map(x=>`<div class="weather-hour"><strong>${hourLabel(x.time)}</strong>${round1(x.temp)}°<br>${windDir(x.dir)} ${round1(x.wind)}<br>${x.pop??0}% · ${round1(x.precip||0)} mm</div>`).join('')}</div>`}
function windDir(deg){if(deg==null)return '–';const d=['N','NØ','Ø','SØ','S','SV','V','NV'];return d[Math.round(((deg%360)+360)%360/45)%8]}
function round1(v){return v==null?'–':(Math.round(v*10)/10).toLocaleString('nb-NO')}
function hourLabel(v){const d=new Date(v);return d.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'})}
function update(){if(!panel)return;panel.querySelectorAll('.property-button').forEach(btn=>{const k=btn.dataset.key;btn.classList.toggle('selected',chosen.has(k));btn.classList.toggle('missing',missing.has(k));btn.textContent=k+(missing.has(k)?' ⚠':'')});const done=loaded.size+missing.size,a=total();panel.querySelector('.summary').innerHTML=`<strong>${a?format(a)+' daa':'Grimstveit'}</strong>${chosen.size} matrikkelenheter i jaktområdet`;panel.querySelector('.status').textContent=done<matrikkelEnheter.length?`Laster ${done} av ${matrikkelEnheter.length}…`:(missing.size?`Ingen geometri for: ${[...missing].join(', ')}`:'Kartdata lastet.');if(done===matrikkelEnheter.length&&!finalFitDone&&territoryLayer){const b=territoryLayer.getBounds();if(b.isValid()){map.fitBounds(b,{padding:[42,42],maxZoom:14});finalFitDone=true}}}
function geometryArea(g){if(g.type==='Polygon')return polygonArea(g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.reduce((s,p)=>s+polygonArea(p),0);return 0}function polygonArea(rs){if(!rs?.length)return 0;return Math.max(0,Math.abs(ringArea(rs[0]))-rs.slice(1).reduce((s,r)=>s+Math.abs(ringArea(r)),0))}function ringArea(cs){const R=6378137,t=Math.PI/180;let a=0;for(let i=0;i<cs.length;i++){const x=cs[i],y=cs[(i+1)%cs.length];a+=(y[0]*t-x[0]*t)*(2+Math.sin(x[1]*t)+Math.sin(y[1]*t))}return a*R*R/2}
</script></body></html>
