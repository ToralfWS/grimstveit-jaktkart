<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e8"><title>Grimstveit jaktkart</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#d7e1d3}#map{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}.property-control{max-width:min(24rem,calc(100vw - 5rem));border:0;border-radius:.75rem;background:rgb(255 255 255 / 95%);box-shadow:0 2px 12px rgb(0 0 0 / 22%);color:#172119;padding:.75rem .85rem}.property-control>.collapse{display:flex;width:100%;justify-content:space-between;border:0;padding:0;background:transparent;font:700 .92rem/1.2 inherit;cursor:pointer}.property-control>.collapse:after{content:"−"}.property-control.is-collapsed>.collapse:after{content:"+"}.property-control.is-collapsed .panel-body{display:none}.summary{margin:.65rem 0 .5rem;padding:.55rem .6rem;border-radius:.55rem;background:#eef6ec;border:1px solid #b9d1b3;font-size:.82rem;line-height:1.35}.summary strong{display:block;font-size:.95rem}.property-buttons{display:flex;flex-wrap:wrap;gap:.35rem;margin:.55rem 0 .45rem}.property-button{appearance:none;border:1px solid #b46a37;border-radius:999px;background:#fff8ee;color:#172119;padding:.3rem .56rem;font:650 .78rem/1.1 inherit;cursor:pointer;touch-action:manipulation}.property-button.selected{border-color:#2f6f3e;background:#dfeedd;color:#174a25}.property-button.missing{border-color:#999;background:#f2f2f2;color:#777}.property-control p{margin:.45rem 0 0;color:#555;font-size:.72rem;line-height:1.35}.hint{color:#334!important}.leaflet-interactive{cursor:pointer;pointer-events:auto}.leaflet-control-zoom a{width:36px;height:36px;line-height:36px}.leaflet-control-attribution{font-size:10px}@media(max-width:600px){.property-control{padding:.65rem .7rem;max-width:min(21rem,calc(100vw - 4.5rem))}}
</style></head><body><main id="map"></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
const TARGET_DAA=10606,STORAGE_KEY='grimstveit-selected-properties-v1';const matrikkelEnheter=[[10,1],[10,2],[10,7],[11,2],[11,84],[12,3],[12,4],[12,5],[12,6],[12,8],[13,4],[19,10],[8,1],[11,127],[10,13]];
const map=L.map('map',{zoomControl:false});L.control.zoom({position:'bottomright'}).addTo(map);map.setView([59.16,8.50],11);L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png',{maxZoom:18,attribution:'<a href="https://www.kartverket.no/">Kartverket</a>'}).addTo(map);new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
const normal={color:'#b5261e',weight:2.2,opacity:.95,fillColor:'#e89347',fillOpacity:.10},selected={color:'#1f6f35',weight:3.5,opacity:1,fillColor:'#4f9a5d',fillOpacity:.30};const chosen=new Set(loadSaved()),layers=new Map(),areas=new Map(),missing=new Set(),loaded=new Set();let bounds=null,panel;addControl();matrikkelEnheter.forEach(([g,b])=>loadProperty(g,b));
async function loadProperty(g,b){const key=`${g}/${b}`;try{const u=new URL('https://api.kartverket.no/eiendom/v1/geokoding');u.searchParams.set('kommunenummer','4030');u.searchParams.set('gardsnummer',g);u.searchParams.set('bruksnummer',b);u.searchParams.set('omrade','true');u.searchParams.set('utkoordsys','4258');const r=await fetch(u);if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();const fs=(d.features||[]).filter(f=>f.geometry&&['Polygon','MultiPolygon'].includes(f.geometry.type));if(!fs.length)throw Error('ingen flater');const daa=fs.reduce((s,f)=>s+geometryArea(f.geometry)/1000,0);areas.set(key,daa);loaded.add(key);const group=L.geoJSON({type:'FeatureCollection',features:fs},{style:()=>chosen.has(key)?selected:normal,onEachFeature:(f,l)=>{l.on({click:e=>{L.DomEvent.stopPropagation(e.originalEvent);toggle(key)},touchend:e=>{L.DomEvent.stopPropagation(e.originalEvent);toggle(key)}});l.bindTooltip(`Gnr/Bnr ${key} · ca. ${format(daa)} daa`,{sticky:true});}}).addTo(map);layers.set(key,group);apply(key);const bnd=group.getBounds();if(bnd.isValid()){bounds=bounds?bounds.extend(bnd):L.latLngBounds(bnd);map.fitBounds(bounds,{padding:[24,24],maxZoom:14})}update()}catch(e){console.warn(key,e);missing.add(key);update()}}
function toggle(key){if(missing.has(key))return;if(chosen.has(key))chosen.delete(key);else chosen.add(key);apply(key);save();update()}
function apply(key){const g=layers.get(key);if(!g)return;g.setStyle(chosen.has(key)?selected:normal);if(chosen.has(key))g.bringToFront()}
function total(){let n=0;chosen.forEach(k=>n+=areas.get(k)||0);return n}function format(v){return Math.round(v).toLocaleString('nb-NO')}function loadSaved(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...chosen]))}catch{}}
function addControl(){const c=L.control({position:'topleft'});c.onAdd=()=>{panel=L.DomUtil.create('section','property-control');panel.innerHTML=`<button class="collapse" type="button">Velg jaktområde</button><div class="panel-body"><div class="summary"><strong>Valgt: 0 daa</strong>Referanse: ${TARGET_DAA.toLocaleString('nb-NO')} daa</div><p class="hint">Trykk på en eiendom i kartet eller på gnr/bnr. Valget kan gjøres også mens kartdata lastes.</p><div class="property-buttons">${matrikkelEnheter.map(([g,b])=>`<button class="property-button" type="button" data-key="${g}/${b}">${g}/${b}</button>`).join('')}</div><p class="status">Henter eiendommer…</p></div>`;L.DomEvent.disableClickPropagation(panel);L.DomEvent.disableScrollPropagation(panel);panel.querySelector('.collapse').addEventListener('click',()=>panel.classList.toggle('is-collapsed'));panel.querySelectorAll('.property-button').forEach(btn=>{btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggle(btn.dataset.key)});btn.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();toggle(btn.dataset.key)})});return panel};c.addTo(map)}
function update(){if(!panel)return;panel.querySelectorAll('.property-button').forEach(btn=>{const k=btn.dataset.key;btn.classList.toggle('selected',chosen.has(k));btn.classList.toggle('missing',missing.has(k));btn.textContent=k+(missing.has(k)?' ⚠':'')});const a=total();panel.querySelector('.summary').innerHTML=`<strong>Valgt: ${format(a)} daa</strong>Referanse fra gammel oversikt: ${TARGET_DAA.toLocaleString('nb-NO')} daa`;const done=loaded.size+missing.size;panel.querySelector('.status').textContent=`Lastet ${done} av ${matrikkelEnheter.length}${missing.size?` · mangler: ${[...missing].join(', ')}`:''}`}
function geometryArea(g){if(g.type==='Polygon')return polygonArea(g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.reduce((s,p)=>s+polygonArea(p),0);return 0}function polygonArea(rs){if(!rs?.length)return 0;return Math.max(0,Math.abs(ringArea(rs[0]))-rs.slice(1).reduce((s,r)=>s+Math.abs(ringArea(r)),0))}function ringArea(cs){const R=6378137,t=Math.PI/180;let a=0;for(let i=0;i<cs.length;i++){const x=cs[i],y=cs[(i+1)%cs.length];a+=(y[0]*t-x[0]*t)*(2+Math.sin(x[1]*t)+Math.sin(y[1]*t))}return a*R*R/2}
</script></body></html>
