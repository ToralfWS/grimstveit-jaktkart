<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2e8">
  <title>Grimstveit jaktkart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #d7e1d3; }
    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    .property-control {
      max-width: min(19rem, calc(100vw - 5rem));
      border: 0;
      border-radius: .75rem;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 2px 12px rgb(0 0 0 / 22%);
      color: #172119;
      padding: .7rem .8rem;
      backdrop-filter: blur(5px);
    }
    .property-control button {
      display: flex; width: 100%; align-items: center; justify-content: space-between;
      border: 0; padding: 0; background: transparent; color: inherit;
      font: 700 .9rem/1.2 inherit; text-align: left; cursor: pointer;
    }
    .property-control button::after { content: "−"; margin-left: .75rem; font-size: 1.2rem; }
    .property-control.is-collapsed button::after { content: "+"; }
    .property-control ul {
      display: flex; flex-wrap: wrap; gap: .35rem; margin: .65rem 0 .25rem; padding: 0;
      list-style: none;
    }
    .property-control.is-collapsed ul, .property-control.is-collapsed p { display: none; }
    .property-control li {
      border: 1px solid #b46a37; border-radius: 999px; background: #fff8ee;
      padding: .18rem .45rem; font-size: .78rem; font-weight: 650;
    }
    .property-control li.missing { border-color: #999; background: #f2f2f2; color: #777; }
    .property-control p { margin: .55rem 0 0; color: #555; font-size: .72rem; line-height: 1.35; }
    .leaflet-control-zoom a { width: 36px; height: 36px; line-height: 36px; }
    .leaflet-control-attribution { max-width: calc(100vw - 1rem); font-size: 10px; }
    .leaflet-popup-content { margin: .75rem 1rem; }
    @media (max-width: 600px) {
      .leaflet-top { top: env(safe-area-inset-top); }
      .leaflet-bottom { bottom: env(safe-area-inset-bottom); }
      .leaflet-left { left: env(safe-area-inset-left); }
      .leaflet-right { right: env(safe-area-inset-right); }
      .property-control { padding: .65rem .7rem; }
    }
  </style>
</head>
<body>
  <!-- redeploy trigger 2026-09-14 -->
  <main id="map" aria-label="Kart over Grimstveit jaktområde"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const mapElement = document.getElementById('map');
    const map = L.map('map', {
      zoomControl: false,
      crs: L.CRS.EPSG3857
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png', {
      maxZoom: 18,
      tileSize: 256,
      zoomOffset: 0,
      attribution: '<a href="https://www.kartverket.no/">Kartverket</a>'
    }).addTo(map);

    const resizeObserver = new ResizeObserver(() => {
      map.invalidateSize({ pan: false });
    });
    resizeObserver.observe(mapElement);

    const propertyStyle = {
      color: '#b5261e',
      weight: 2.5,
      opacity: 1,
      fillColor: '#e89347',
      fillOpacity: 0.10,
      lineJoin: 'round'
    };

    const matrikkelEnheter = [
      [10, 1], [10, 2], [10, 7],
      [11, 2], [11, 84],
      [12, 3], [12, 4], [12, 5], [12, 6], [12, 8],
      [13, 4], [19, 10], [8, 1]
    ];

    addPropertyControl(matrikkelEnheter);
    loadOfficialPropertyBoundaries();

    async function loadOfficialPropertyBoundaries() {
      const allFeatures = [];
      const missing = [];

      const results = await Promise.allSettled(
        matrikkelEnheter.map(async ([gnr, bnr]) => {
          const url = new URL('https://api.kartverket.no/eiendom/v1/geokoding');
          url.searchParams.set('kommunenummer', '4030');
          url.searchParams.set('gardsnummer', gnr);
          url.searchParams.set('bruksnummer', bnr);
          url.searchParams.set('omrade', 'true');
          url.searchParams.set('utkoordsys', '4258');

          const response = await fetch(url);
          if (!response.ok) throw new Error(`${gnr}/${bnr}: HTTP ${response.status}`);
          const data = await response.json();
          const features = (data.features || [])
            .filter(feature => feature.geometry && ['Polygon', 'MultiPolygon'].includes(feature.geometry.type))
            .map(feature => ({
              ...feature,
              properties: {
                ...feature.properties,
                gnr,
                bnr
              }
            }));

          if (!features.length) throw new Error(`${gnr}/${bnr}: ingen flater returnert`);
          return { gnr, bnr, features };
        })
      );

      results.forEach((result, index) => {
        const [gnr, bnr] = matrikkelEnheter[index];
        if (result.status === 'fulfilled') {
          allFeatures.push(...result.value.features);
        } else {
          console.warn(result.reason);
          missing.push(`${gnr}/${bnr}`);
        }
      });

      if (!allFeatures.length) {
        console.error('Ingen eiendomsgrenser kunne lastes fra Kartverket.');
        map.setView([59.16, 8.50], 11);
        updatePropertyControl([], matrikkelEnheter.map(([g, b]) => `${g}/${b}`));
        return;
      }

      const featureCollection = {
        type: 'FeatureCollection',
        features: allFeatures
      };

      const propertiesLayer = L.geoJSON(featureCollection, {
        style: propertyStyle,
        onEachFeature(feature, layer) {
          const { gnr, bnr, hovedområde, objekttype, lokalid } = feature.properties;
          const details = [
            objekttype ? `Type: ${objekttype}` : null,
            hovedområde === true ? 'Hovedteig' : null,
            lokalid ? `Teig-ID: ${lokalid}` : null
          ].filter(Boolean).join('<br>');
          layer.bindPopup(`<strong>Gnr/Bnr ${gnr}/${bnr}</strong><br>Nissedal kommune${details ? `<br>${details}` : ''}`);
        }
      }).addTo(map);

      const bounds = propertiesLayer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [24, 24], maxZoom: 14 });
      }

      const loadedLabels = [...new Set(allFeatures.map(feature => `${feature.properties.gnr}/${feature.properties.bnr}`))];
      updatePropertyControl(loadedLabels, missing);
    }

    let propertyPanel;
    function addPropertyControl(entries) {
      const control = L.control({ position: 'topleft' });
      control.onAdd = () => {
        propertyPanel = L.DomUtil.create('section', 'property-control');
        propertyPanel.innerHTML = `
          <button type="button" aria-expanded="true">Eiendomsgrenser</button>
          <ul>${entries.map(([gnr, bnr]) => `<li>${gnr}/${bnr}</li>`).join('')}</ul>
          <p>Henter offisielle teiggeometrier fra Kartverkets åpne eiendoms-API…</p>`;
        L.DomEvent.disableClickPropagation(propertyPanel);
        propertyPanel.querySelector('button').addEventListener('click', event => {
          const collapsed = propertyPanel.classList.toggle('is-collapsed');
          event.currentTarget.setAttribute('aria-expanded', String(!collapsed));
        });
        return propertyPanel;
      };
      control.addTo(map);
    }

    function updatePropertyControl(loaded, missing) {
      if (!propertyPanel) return;
      const loadedSet = new Set(loaded);
      const missingSet = new Set(missing);
      const items = matrikkelEnheter.map(([gnr, bnr]) => {
        const label = `${gnr}/${bnr}`;
        const isMissing = missingSet.has(label) && !loadedSet.has(label);
        return `<li${isMissing ? ' class="missing"' : ''}>${label}${isMissing ? ' ⚠' : ''}</li>`;
      }).join('');
      propertyPanel.querySelector('ul').innerHTML = items;
      propertyPanel.querySelector('p').textContent = missing.length
        ? `Kartverket-data lastet. Ingen geometri funnet for: ${missing.join(', ')}.`
        : 'Offisielle teiggeometrier lastet fra Kartverkets åpne eiendoms-API.';
    }
  </script>
</body>
</html>
